# 대화분석 API: PR에서는 검사만, main에 들어오면 검사 후 Cloudflare Workers에 배포한다
name: conversation-analysis

on:
  push:
    branches: [main]
    paths:
      - services/conversation-analysis/**
      - .github/workflows/conversation-analysis.yml
  pull_request:
    paths:
      - services/conversation-analysis/**
      - .github/workflows/conversation-analysis.yml
  workflow_dispatch:

defaults:
  run:
    working-directory: services/conversation-analysis

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src tests

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: conversation-analysis-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
